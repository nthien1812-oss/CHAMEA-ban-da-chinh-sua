<svg width="400" height="260" viewBox="0 0 400 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- CHAMÉA Monogram Symbol with Rounder, Fuller Calligraphic C (Dark/Inverted) -->
  <g transform="translate(135, 8)">
    <!-- 1. Outer Left Champagne Ribbon Loop (#AB8A6B) -->
    <path
      d="M 31.2 49.4 C 18.2 65.0 7.8 83.2 7.8 94.9 C 7.8 107.9 18.2 114.4 31.2 109.2 C 33.8 107.9 35.1 104.0 35.1 104.0"
      stroke="#AB8A6B"
      stroke-width="4.4"
      stroke-linecap="round"
      fill="none"
    />

    <!-- 2. Champagne Ribbon Crossing through Crescent Body (#AB8A6B) -->
    <path
      d="M 32.5 105.3 L 50.7 84.5"
      stroke="#AB8A6B"
      stroke-width="4.9"
      stroke-linecap="round"
    />

    <!-- 3. Rounded Calligraphic C Spine & Outer Shape (#FEFBFD) -->
    <path
      d="M 96.2 35.1 C 87.1 19.5 70.2 14.3 52.0 18.2 C 29.9 23.4 19.5 46.8 19.5 70.2 C 19.5 97.5 35.1 122.2 65.0 126.1 C 88.4 128.7 104.0 114.4 107.9 96.2 C 109.2 91.0 104.0 87.1 100.1 89.7 C 94.9 101.4 83.2 113.1 66.3 113.1 C 45.5 113.1 36.4 94.9 36.4 70.2 C 36.4 46.8 48.1 27.3 67.6 23.4 C 81.9 19.5 92.3 26.0 94.9 33.8 C 96.2 35.1 97.5 36.4 96.2 35.1 Z"
      fill="#FEFBFD"
    />

    <!-- 4. Inner Arched Wave traversing to Upper Right (#FEFBFD) -->
    <path
      d="M 50.7 84.5 C 62.4 71.5 75.4 58.5 85.8 55.9 C 92.3 54.6 94.9 59.8 96.2 65.0 C 94.9 65.0 92.3 59.8 85.8 61.1 C 75.4 62.4 62.4 74.1 50.7 84.5 Z"
      fill="#FEFBFD"
    />

    <!-- 5. 4-Point Star in Right Opening (#AB8A6B) -->
    <path
      d="M 89.7 67.6 Q 90.7 80.0 98.8 80.6 Q 90.7 81.2 89.7 93.6 Q 88.7 81.2 80.6 80.6 Q 88.7 80.0 89.7 67.6 Z"
      fill="#AB8A6B"
    />
