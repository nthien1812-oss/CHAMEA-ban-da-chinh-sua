  <!-- Wordmark: CHAMÉA (#FEFBFD) -->
  <text
    x="200"
    y="185"
    text-anchor="middle"
    fill="#FEFBFD"
    font-family="'Playfair Display', 'Noto Serif', 'Times New Roman', serif"
    font-size="38"
    font-weight="600"
    letter-spacing="12"
  >CHAMÉA</text>

  <!-- Slogan: CHẠM ĐÚNG NGƯỜI • TRAO ĐÚNG QUÀ -->
  <text
    x="200"
    y="228"
    text-anchor="middle"
    fill="#D9C8BA"
    font-family="'Montserrat', system-ui, sans-serif"
    font-size="11"
    font-weight="500"
    letter-spacing="5"
  >CHẠM ĐÚNG NGƯỜI  •  TRAO ĐÚNG QUÀ</text>
</svg>
